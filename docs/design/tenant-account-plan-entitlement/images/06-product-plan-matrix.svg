    <text x="352" y="328" fill="#64748B">20</text><text x="528" y="328" fill="#64748B">200</text><text x="704" y="328" font-weight="800" fill="#0F172A">1000</text><text x="904" y="328" fill="#64748B">5000</text><text x="1060" y="328" fill="#64748B">人工配置</text>
    <line x1="100" y1="350" x2="1180" y2="350" stroke="#E6EDF5"/>
