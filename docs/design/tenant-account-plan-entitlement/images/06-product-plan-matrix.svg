  <rect x="100" y="656" width="1080" height="34" rx="17" fill="#FFF7ED"/>
  <text x="126" y="678" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#92400E">设计边界：套餐权益是租户级能力，不直接替代用户角色权限；真实计费、支付、合同和发票不进入 V1。</text>
