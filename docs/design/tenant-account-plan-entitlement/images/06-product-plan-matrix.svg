  <text x="100" y="128" font-family="Arial, 'PingFang SC', sans-serif" font-size="14" fill="#64748B">该页面用于管理套餐模板和权益版本。首个 V1 可保持只读，后续再开放版本管理。</text>
  <rect x="1010" y="84" width="156" height="42" rx="11" fill="#F8FAFC" stroke="#D8E3F0"/>
