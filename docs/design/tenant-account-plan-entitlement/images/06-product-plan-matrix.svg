    <text x="352" y="392" fill="#64748B">300</text><text x="528" y="392" fill="#64748B">2000</text><text x="704" y="392" font-weight="800" fill="#0F172A">10000</text><text x="904" y="392" fill="#64748B">50000</text><text x="1060" y="392" fill="#64748B">人工配置</text>
