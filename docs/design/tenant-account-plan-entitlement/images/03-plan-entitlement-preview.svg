    <rect x="104" y="556" width="230" height="74" rx="12" fill="#F8FAFC" stroke="#E6EDF5"/>
    <text x="124" y="586" fill="#64748B">客户数上限</text><text x="124" y="616" font-size="24" font-weight="800" fill="#0F172A">5,000</text>
    <rect x="350" y="556" width="230" height="74" rx="12" fill="#F8FAFC" stroke="#E6EDF5"/>
    <text x="370" y="586" fill="#64748B">知识库文件</text><text x="370" y="616" font-size="24" font-weight="800" fill="#0F172A">1,000</text>
    <rect x="596" y="556" width="230" height="74" rx="12" fill="#F8FAFC" stroke="#E6EDF5"/>
    <text x="616" y="586" fill="#64748B">月度 AI 调用</text><text x="616" y="616" font-size="24" font-weight="800" fill="#0F172A">10,000</text>
    <rect x="842" y="556" width="230" height="74" rx="12" fill="#F8FAFC" stroke="#E6EDF5"/>
    <text x="862" y="586" fill="#64748B">成员数量</text><text x="862" y="616" font-size="24" font-weight="800" fill="#0F172A">50</text>
  </g>
